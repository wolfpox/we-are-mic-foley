<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>We Are Mic Foley</title>
  <meta name="description" content="Sounds Like A Good Idea. Record anything, then turn it into game-ready sound effects.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
</head>
<body>
<div class="app">

  <!-- HOME -->
  <main class="screen" id="home">
    <div class="top">
      <div class="brand">We Are Mic <span>Foley</span></div>
    </div>
    <div class="doors">
      <button class="door check" id="toChecklist" type="button"><b>Create your checklist</b><small id="checkSub">What does your game need?</small></button>
      <button class="door" id="toGuide" type="button"><b>How to think like a Foley artist</b><small>7 ideas · 1 min</small></button>
    </div>
    <section class="library" aria-labelledby="libTitle">
      <div class="lib-head"><h2 id="libTitle">Your sounds</h2><span id="libCount"></span></div>
      <div class="legend"><span><i class="raw"></i>as recorded</span><span><i class="made"></i>made into sound effects</span></div>
      <div class="tagbar" id="tagbar" role="toolbar" aria-label="Show only"></div>
      <div id="lib"></div>
    </section>
  </main>

  <!-- CHECKLIST -->
  <main class="screen" id="checklist" hidden>
    <div class="top"><button class="back" data-home type="button">‹ Back</button></div>
    <div><h1 class="page">Your checklist</h1><p class="sub" id="checkSummary"></p></div>
    <form class="add" id="addForm"><input id="addIn" type="text" placeholder="A sound your game needs" autocomplete="off" aria-label="Add a sound"><button type="submit">Add</button></form>
    <div class="checks" id="checks"></div>
    <p class="label" id="suggestLabel">Tap to add</p>
    <div class="chips" id="suggest"></div>
  </main>

  <!-- HOW TO THINK LIKE A FOLEY ARTIST -->
  <main class="screen" id="guide" hidden>
    <div class="top"><button class="back" data-home type="button">‹ Back</button><span class="top-note">How to think like a Foley artist</span></div>
    <div class="deck">
      <div class="card" id="card" aria-live="polite"></div>
      <div class="pager"><button id="prev" type="button" aria-label="Previous">‹</button><div class="dots" id="dots"></div><button id="next" type="button" aria-label="Next">›</button></div>
    </div>
  </main>

  <footer id="footer">
    <p>Saved in this browser as you go. Your recordings never leave this device.</p>
  </footer>
</div>

<dialog id="exportDlg" aria-labelledby="dlgTitle">
  <form method="dialog" class="dlg">
    <h2 id="dlgTitle">File settings</h2>
    <label class="field">File type
      <select id="expFormat">
        <option value="ogg" selected>Ogg Vorbis</option>
        <option value="mp3">MP3</option>
        <option value="wav">WAV</option>
      </select>
    </label>
    <label class="field">Quality
      <select id="expQuality">
        <option value="small">Smallest files</option>
        <option value="balanced" selected>Balanced</option>
        <option value="high">High</option>
      </select>
    </label>
    <label class="field">Sample rate
      <select id="expRate">
        <option value="44100" selected>44.1 kHz</option>
        <option value="22050">22 kHz (smaller)</option>
      </select>
    </label>
    <label class="toggle"><input id="evenLoud" type="checkbox" checked> Even out loudness across takes</label>
    <p class="hint" id="formatHint"></p>
    <button class="done" value="ok">Done</button>
  </form>
</dialog>

<div class="toast" id="toast" hidden role="status"><span id="toastTxt"></span><button id="toastBtn" type="button"></button></div>

<div class="dock">
  <div class="dock-side left">
    <button class="round" id="undoBtn" type="button" aria-label="Undo" aria-keyshortcuts="Control+Z" hidden>↶</button>
    <button class="round" id="redoBtn" type="button" aria-label="Redo" aria-keyshortcuts="Control+Shift+Z" hidden>↷</button>
  </div>
  <div class="dock-mid">
    <div class="timer" id="timer" aria-live="polite"></div>
    <button class="recbtn" id="rec" type="button" aria-label="Record"><span class="ring" id="ring"></span><span class="core"></span></button>
    <div class="dock-hint" id="recHint">Record anything</div>
  </div>
  <div class="dock-side right">
    <label class="round" title="Upload audio" aria-label="Upload audio">↑<input id="fileIn" type="file" accept="audio/*"></label>
  </div>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
